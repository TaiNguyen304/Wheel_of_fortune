<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Player 2</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        * {
            box-sizing: border-box;
            font-family: sans-serif;
            font-weight: bold !important;
        }

        body {
            margin: 0;
            padding: 0;
            background: purple;
            color: white;
            display: flex;
            height: 100vh;
            overflow: hidden;
        }

        .left-panel {
            width: 80%;
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
            background: purple;
        }

        .right-panel {
            width: 20%;
            background: #f0f2f5;
            color: black;
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 15px;
            box-shadow: -2px 0 10px rgba(0, 0, 0, 0.3);
            z-index: 10;
        }

        .wheel-area {
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
            width: 600px;
            height: 600px;
            transition: transform 0.8s cubic-bezier(0.25, 1, 0.5, 1);
            /* SỬA LẠI TÂM XOAY: Đặt tâm ở chính giữa vòng quay để xoay cân đối 100% */
            transform-origin: center center;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
        }

        /* ĐIỀU CHỈNH ZOOM: 
           - Kéo xuống dưới màn hình (translateY 350px)
           - Phóng to lên gấp 2.4 lần giống trong ảnh chụp
           - Xoay góc tương ứng để kim nằm ở đỉnh 
        */
        .wheel-area.zoomed-red,
        .wheel-area.zoomed.tilt-red {
            transform: translateY(350px) scale(2) rotate(30deg);
        }

        .wheel-area.zoomed-yellow,
        .wheel-area.zoomed {
            transform: translateY(350px) scale(2) rotate(0deg);
        }

        .wheel-area.zoomed-blue,
        .wheel-area.zoomed.tilt-blue {
            transform: translateY(350px) scale(2) rotate(-30deg);
        }

        .wheel-container {
            width: 470px;
            height: 470px;
            position: relative;
            border-radius: 50%;
            box-shadow: 0 4px 18px rgba(0, 0, 0, 0.6);
            image-rendering: -webkit-optimize-contrast;
            image-rendering: high-quality;
        }

        #wheelGraphic {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            display: block;
            position: relative;
            transform-origin: 235px 235px !important;
            overflow: visible;
            image-rendering: -webkit-optimize-contrast;
            image-rendering: high-quality;
            -webkit-font-smoothing: antialiased;
        }

        .wheel-face {
            position: absolute;
            top: 18px;
            left: 18px;
            width: calc(100% - 36px);
            height: calc(100% - 36px);
            border-radius: 50%;
            background-image: url('./Nón.png');
            background-position: center center !important;
            background-repeat: no-repeat;
            background-size: 100% 100% !important;
            transform-origin: 217px 217px !important;
            pointer-events: none;
            overflow: hidden;
            image-rendering: -webkit-optimize-contrast;
            image-rendering: high-quality;
            -webkit-font-smoothing: antialiased;
        }

        #wheelGraphic.wheel-type-sub .wheel-face,
        #wheelGraphic.wheel-type-special .wheel-face {
            background-size: 101.86% 101.86% !important;
        }

        #wheelGraphic.wheel-type-normal .wheel-face,
        #wheelGraphic.wheel-type-wheel_2 .wheel-face,
        #wheelGraphic.wheel-type-wheel_3 .wheel-face,
        #wheelGraphic.wheel-type-wheel_4 .wheel-face {
            background-size: 100% 100% !important;
        }

        #specialValuePopup {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background-color: purple;
            color: white;
            padding: 12px 24px;
            font-size: 26px;
            border-radius: 8px;
            border: 3px solid white;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.7);
            z-index: 999;
            display: none;
            text-align: center;
            white-space: nowrap;
        }

        /* Chỉ hiển thị các ô thẻ khi ở Nón thường */
        .wheel-type-sub .items-ring,
        .wheel-type-special .items-ring {
            display: none !important;
        }

        .items-ring {
            position: absolute;
            top: 18px;
            left: 18px;
            width: calc(100% - 36px);
            height: calc(100% - 36px);
            pointer-events: none;
            z-index: 2;
            transform-origin: center center !important;
        }

        .placed-item {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            transform-origin: center center !important;
            display: none;
        }

        .placed-item img {
            position: absolute;
            left: 50%;
            transform: translateX(-50%);
            object-fit: fill;
            image-rendering: -webkit-optimize-contrast;
            image-rendering: high-quality;
        }

        .placed-item.is-card img {
            top: 6px;
            width: 8.5%;
            max-height: 38px;
            object-fit: contain;
            clip-path: none;
        }

        .placed-item.is-wedge img {
            top: 0px;
            width: 13.1%;
            height: 30%;
            object-fit: fill;
            clip-path: none;
        }

        .wheel-ring-svg {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 5;
            transform-origin: 235px 235px !important;
            shape-rendering: geometricPrecision;
        }

        .pointer-wrapper {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            transform-origin: 235px 235px !important;
            z-index: 10;
            pointer-events: none;
        }

        .wrapper-red {
            transform: rotate(-30deg);
        }

        .wrapper-yellow {
            transform: rotate(0deg);
        }

        .wrapper-blue {
            transform: rotate(30deg);
        }

        .pointer-body {
            position: absolute;
            top: -12px;
            left: calc(50% - 10px);
            width: 20px;
            height: 32px;
        }

        .pointer-body svg path {
            transition: fill 0.2s;
        }

        #pointer-red {
            --p-color: #FFFFFF;
        }

        #pointer-yellow {
            --p-color: #FFFFFF;
        }

        #pointer-blue {
            --p-color: #FFFFFF;
        }

        /* UI CONTROLS BÊN PHẢI */
        .top-indicators {
            display: flex;
            gap: 10px;
            margin-bottom: 10px;
        }

        .indicator {
            flex: 1;
            padding: 12px 0;
            text-align: center;
            background: black;
            color: white;
            border-radius: 5px;
            border: 2px solid #ccc;
            transition: 0.3s;
            font-size: 14px;
        }

        .indicator.active-red {
            background: red;
            border-color: red;
        }

        .indicator.active-yellow {
            background: yellow;
            color: black;
            border-color: yellow;
        }

        .indicator.active-blue {
            background: blue;
            border-color: blue;
        }

        h3 {
            margin-bottom: 5px;
            margin-top: 15px;
            color: #333;
        }

        button {
            padding: 12px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            color: white;
            transition: 0.2s;
            font-weight: bold;
            width: 100%;
        }

        /* HOVER TẤT CẢ CÁC NÚT RA MÀU ORANGE CHỮ ĐẬM ĐEN */
        button:not(:disabled):hover {
            background: orange !important;
            color: #000000 !important;
        }

        .zoom-buttons {
            display: flex;
            gap: 5px;
        }

        .zoom-buttons button {
            padding: 10px 5px;
            font-size: 12px;
        }

        hr {
            border: 1px dashed #ccc;
            width: 100%;
            margin: 15px 0;
        }

        label {
            color: #333;
            font-size: 14px;
        }

        input[type="number"] {
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 5px;
            width: 100%;
            margin-bottom: 15px;
        }

        #btnSpin {
            background: black;
            color: white;
            font-size: 20px;
            padding: 15px;
            text-transform: uppercase;
        }

        #btnSpin.enabled {
            background: green;
            color: white;
        }
    </style>
</head>

                            </defs>
                            <path d="M 10,31 L 3.2,11.5 A 7.5,7.5 0 1,1 16.8,11.5 Z" fill="var(--p-color)"

                        </svg>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <div class="right-panel">
        <div class="top-indicators">
            <div id="ind-red" class="indicator">ĐỎ</div>

        <h3>Zoom Kim</h3>

        <hr>

        <h3>Điều khiển Nón</h3>

        <input type="number" id="playerSpinTime" min="8" max="10" value="10">
        <button id="btnSpin" onclick="playerSpin()" disabled>Quay</button>
    </div>

    <script>
        const MY_COLOR = 'yellow';
        const MY_PLAYER = 'Player2';
        const PASS_FIELD = 'p2_pass';

        var supabaseUrl = 'https://vjwwbzjzcbtkksehwfll.supabase.co';
        var supabaseKey = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InZqd3diemp6Y2J0a2tzZWh3ZmxsIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzk5NDIyOTYsImV4cCI6MjA5NTUxODI5Nn0.Zcn4hvlLtRirM-SPGrFvu3ivu8RYF9WngvbxCMCGfh4';
        var supabase = window.supabase.createClient(supabaseUrl, supabaseKey);

        const urlParams = new URLSearchParams(window.location.search);
        const roomId = urlParams.get('roomid');
        const authToken = urlParams.get('auth');

        if (!roomId || !authToken) {
            window.location.href = 'index.html';
        }

        // BỔ SUNG: Khai báo đối tượng Audio toàn cục
        let currentGlobalAudio = null;

        function playSoundEffect(soundFile) {
            if (soundFile === 'STOP') {
                if (currentGlobalAudio) {
                    currentGlobalAudio.pause();
                    currentGlobalAudio.currentTime = 0;
                }
                return;
            }

            if (currentGlobalAudio) {
                currentGlobalAudio.pause();
                currentGlobalAudio.currentTime = 0;
            }

            // Đảm bảo file âm thanh nằm chung thư mục với file HTML
            currentGlobalAudio = new Audio('./' + soundFile);
            currentGlobalAudio.play().catch(function (error) {
                console.warn("Chưa tương tác với trang nên chưa thể autoplay sound:", error);
            });
        }

        let channel = null;

        let currentRotation = 270;
        let isSpecialMode = false;
        let specialWedges = [];
        let animationFrameId = null;
        let isSpinningNow = false;
        let activeWheelType = 'normal';

        function normalizeAngle(deg) {
            return ((deg % 360) + 360) % 360;
        }

        function getVisualRotation() {
            const style = wheelGraphic.style.transform || '';
            const match = style.match(/rotate\(\s*([-\d.]+)deg\s*\)/);
            if (match) return parseFloat(match[1]);
            return currentRotation;
        }

        const wheelGraphic = document.getElementById('wheelGraphic');
        const wheelFace = document.getElementById('wheelFace');
        const wheelArea = document.getElementById('wheelArea');
        const itemsRing = document.getElementById('itemsRing');
        const specialValuePopup = document.getElementById('specialValuePopup');
        const btnSpin = document.getElementById('btnSpin');

        const itemsPlacementConfig = {
            "Thẻ Phần thưởng": { angle: 15, img: "Thẻ Phần Thưởng.png" },
            "Thẻ 1/2 thứ 1": { angle: 30, img: "Thẻ 12 thứ 1.png" },
            "Thẻ 1/2 thứ 2": { angle: 240, img: "Thẻ 12 thứ 2.png" },
            "Thẻ Cơ hội": { angle: 45, img: "Thẻ Cơ Hội.png" },
            "Thẻ Nhân Đôi": { angle: 180, img: "Thẻ Nhân Đôi.png" },
            "Thẻ Kháng Mất điểm": { angle: 105, img: "Thẻ Kháng Mất Điểm.png" },
            "Thẻ Bảo vệ": { angle: 210, img: "Thẻ Bảo Vệ.png" },
            "Thẻ Thêm lượt": { angle: 255, img: "Thẻ Thêm Lượt.png" },
            "Ô Độc đắc": { angle: 135, img: "Ô Độc Đắc.png" },
            "Ô Ẩn số": { angle: 315, img: "Ô Ẩn Số.png" },
            "Ô Bí Mật 1": { angle: 150, img: "Ô Bí Mật 1.png" },
            "Ô Bí Mật 2": { angle: 330, img: "Ô Bí Mật 2.png" },
            "Ô Siêu Tốc": { angle: 135, img: "Ô Siêu Tốc.png" },
            "Ô Thêm lượt": { angle: 315, img: "Ô Thêm Lượt.png" },
            "Ô Két sắt": { angle: 135, img: "Ô Két Sắt.png" },
            "Ô Thử Thách": { angle: 315, img: "Ô Thử Thách.png" },
            "Ô Nhân đôi": { angle: 135, img: "Ô Nhân Đôi.png" },
            "Ô Quy Đổi": { angle: 315, img: "Ô Quy Đổi.png" },
            "Ô Đặt Cược": { angle: 135, img: "Ô Đặt Cược.png" },
            "Ô Tăng Tốc": { angle: 315, img: "Ô Tăng Tốc.png" },
            "Ô 1 Triệu": { angle: 165, img: "Ô 1 Triệu.png" },
            "Ô Mất điểm": { angle: 75, img: "Ô Mất Điểm.png" },
            "Ô 1.000": { angle: 90, img: "Ô 1000.png" },
            "Ô 2.500": { angle: 90, img: "Ô 2500.png" },
            "Ô 3.500": { angle: 90, img: "Ô 3500.png" },
            "Ô 4.000": { angle: 90, img: "Ô 4000.png" },
            "Ô Đổi điểm": { angle: 330, img: "Ô Đổi Điểm.png" },
            "Ô Quyền năng": { angle: 150, img: "Ô Quyền Năng.png" }
        };

        Object.keys(itemsPlacementConfig).forEach(itemName => {
            const config = itemsPlacementConfig[itemName];
            const itemWrapper = document.createElement('div');
            itemWrapper.className = 'placed-item ' + (itemName.startsWith("Thẻ") ? 'is-card' : 'is-wedge');
            itemWrapper.id = 'render-item-' + itemName.replace(/\s+/g, '_');
            itemWrapper.style.transform = `rotate(${config.angle}deg)`;

            const imgEl = document.createElement('img');
            imgEl.src = './' + config.img;
            imgEl.alt = itemName;
            itemWrapper.appendChild(imgEl);
            itemsRing.appendChild(itemWrapper);
        });

        function inferWheelTypeFromBg(bg) {
            if (!bg) return 'normal';
            if (bg.includes('Nón Phụ')) return 'sub_wheel';
            if (bg.includes('Đặc Biệt')) return 'special';
            if (bg.includes('Nón 2')) return 'wheel_2';
            if (bg.includes('Nón 3')) return 'wheel_3';
            if (bg.includes('Nón 4')) return 'wheel_4';
            return 'normal';
        }

        function isRegularWheelType(type) {
            return ['normal', 'wheel_2', 'wheel_3', 'wheel_4'].includes(type);
        }

        function updateWheelElementsVisibility() {
            const isRegular = isRegularWheelType(activeWheelType);
            wheelGraphic.classList.remove('wheel-type-normal', 'wheel-type-sub', 'wheel-type-special', 'wheel-type-wheel_2', 'wheel-type-wheel_3', 'wheel-type-wheel_4');
            wheelGraphic.classList.add('wheel-type-' + activeWheelType);

            if (itemsRing) {
                itemsRing.style.display = isRegular ? 'block' : 'none';
            }
        }
        updateWheelElementsVisibility();

        const svgDotsGroup = document.getElementById('svgDotsGroup');
        if (svgDotsGroup) {
            svgDotsGroup.innerHTML = '';
            for (let i = 0; i < 72; i++) {
                const angleDeg = i * 5 - 7.5;
                const rad = (angleDeg - 90) * Math.PI / 180;
                const cx = 235 + 226 * Math.cos(rad);
                const cy = 235 + 226 * Math.sin(rad);
                const circle = document.createElementNS('http://www.w3.org/2000/svg', 'circle');
                circle.setAttribute('cx', cx.toFixed(3));
                circle.setAttribute('cy', cy.toFixed(3));
                circle.setAttribute('r', '4.25');
                circle.setAttribute('fill', '#ffffff');
                circle.setAttribute('filter', 'url(#dot-shadow)');
                circle.setAttribute('shape-rendering', 'geometricPrecision');
                svgDotsGroup.appendChild(circle);
            }
        }

        function applyZoomState(isZoomed, tilt) {
            wheelArea.classList.remove('zoomed', 'zoomed-red', 'zoomed-yellow', 'zoomed-blue', 'tilt-red', 'tilt-blue');
            if (isZoomed) {
                if (tilt === 'red') {
                    wheelArea.classList.add('zoomed-red');
                } else if (tilt === 'blue') {
                    wheelArea.classList.add('zoomed-blue');
                } else {
                    wheelArea.classList.add('zoomed-yellow');
                }
            }
        }

        function zoomLocal(target) {
            if (target === 'red') applyZoomState(true, 'red');
            else if (target === 'yellow') applyZoomState(true, 'yellow');
            else if (target === 'blue') applyZoomState(true, 'blue');
            else applyZoomState(false, 'none');
        }

        function lockLocalSpin() {
            btnSpin.disabled = true;
            btnSpin.classList.remove('enabled');
            btnSpin.style.background = 'black';
        }

        function unlockLocalSpin() {
            btnSpin.disabled = false;
            btnSpin.classList.add('enabled');
            btnSpin.style.background = 'green';
        }

        const MIN_SPIN_ROTATIONS = 5;

        function computeSpinTarget(startRot, duration, randomOffset, minRotations) {
            const minRot = (minRotations || MIN_SPIN_ROTATIONS) * 360;
            let finalDuration = parseFloat(duration);
            if (isNaN(finalDuration) || finalDuration <= 0) finalDuration = 5;
            const durationRot = finalDuration * 360;
            const totalExtra = Math.max(minRot, durationRot) + (randomOffset || 0);
            const start = parseFloat(startRot);
            return { startRot: start, targetRot: start + totalExtra, finalDuration: finalDuration };
        }

        function playerSpin() {
            if (!channel || btnSpin.disabled) return;

            let timeInput = parseInt(document.getElementById('playerSpinTime').value);
            if (isNaN(timeInput) || timeInput < 8 || timeInput > 10) {
                timeInput = 10;
                document.getElementById('playerSpinTime').value = 10;
            }

            const startRot = getVisualRotation();
            currentRotation = startRot;
            const offset = Math.floor(Math.random() * 3601);
            const startTime = Date.now();
            const spin = computeSpinTarget(startRot, timeInput, offset, MIN_SPIN_ROTATIONS);

            channel.send({
                type: 'broadcast',
                event: 'spin_wheel',
                payload: {
                    duration: spin.finalDuration,
                    randomOffset: offset,
                    startTime: startTime,
                    startRot: startRot,
                    minRotations: MIN_SPIN_ROTATIONS
                }
            });

            executeSpin(timeInput, offset, startTime, startRot, MIN_SPIN_ROTATIONS);
            lockLocalSpin();
        }

        function executeSpin(duration, randomOffset, startTime, startRotFromSource, minRotations) {
            if (animationFrameId) {
                cancelAnimationFrame(animationFrameId);
                animationFrameId = null;
            }
            if (typeof lockLocalSpin === 'function') lockLocalSpin();
            isSpinningNow = true;

            if (wheelGraphic) {
                wheelGraphic.style.transition = 'none';
                wheelGraphic.style.willChange = 'transform';
            }

            const startRotBase = (startRotFromSource !== undefined && startRotFromSource !== null && !isNaN(startRotFromSource))
                ? normalizeAngle(parseFloat(startRotFromSource))
                : normalizeAngle(getVisualRotation());

            const spin = computeSpinTarget(startRotBase, duration, randomOffset, minRotations);
            const startRot = spin.startRot;
            const targetRot = spin.targetRot;
            const finalDuration = spin.finalDuration;

            currentRotation = startRot;
            wheelGraphic.style.transform = `rotate(${startRot}deg)`;

            if (document.getElementById('specialValuePopup')) {
                document.getElementById('specialValuePopup').style.display = 'none';
            }

            const startTimestamp = Date.now();
            const durationMs = finalDuration * 1000;

            function easeOutQuint(t) {
                return 1 - Math.pow(1 - t, 5);
            }

            function updateProgress() {
                const now = Date.now();
                const elapsed = now - startTimestamp;

                if (elapsed >= durationMs) {
                    const finalNorm = normalizeAngle(targetRot);
                    currentRotation = finalNorm;
                    if (wheelGraphic) wheelGraphic.style.willChange = 'auto';
                    wheelGraphic.style.transform = `rotate(${finalNorm}deg)`;
                    animationFrameId = null;
                    isSpinningNow = false;
                } else {
                    const t = Math.min(Math.max(elapsed / durationMs, 0), 1);
                    const progress = easeOutQuint(t);
                    const currentPos = startRot + (targetRot - startRot) * progress;
                    wheelGraphic.style.transform = `rotate(${currentPos}deg)`;
                    animationFrameId = requestAnimationFrame(updateProgress);
                }
            }
            animationFrameId = requestAnimationFrame(updateProgress);
        }

        function updateIndicator(color, isActive) {
            const ind = document.getElementById('ind-' + color);
            if (ind) {
                if (isActive) ind.classList.add('active-' + color);
                else ind.classList.remove('active-' + color);
            }
        }

        // LẮNG NGHE TÍN HIỆU REALTIME
        function formatWedgeValue(value) {
            return typeof value === 'number' ? value.toLocaleString() + " điểm" : value;
        }

        function getWedgeValueAtYellowPointer() {
            if (!isSpecialMode || specialWedges.length === 0) return "Chưa xáo giá trị";
            const rotation = getVisualRotation();
            let angleAtTop = normalizeAngle(360 - normalizeAngle(rotation));
            let wedgeIndex = Math.floor(normalizeAngle(angleAtTop + 7.5) / 15) % 24;
            return formatWedgeValue(specialWedges[wedgeIndex]);
        }

        function executeShowValue(wedgeIndexFromSource, displayTextFromSource) {
            if (!isSpecialMode) return;
            let displayText;
            if (wedgeIndexFromSource !== undefined && wedgeIndexFromSource !== null && specialWedges.length > 0) {
                displayText = displayTextFromSource || formatWedgeValue(specialWedges[wedgeIndexFromSource]);
            } else {
                currentRotation = getVisualRotation();
                displayText = getWedgeValueAtYellowPointer();
            }
            specialValuePopup.innerText = displayText;
            specialValuePopup.style.display = 'block';
        }

        function executeHideValue() {
            specialValuePopup.style.display = 'none';
        }

        function executeFindHighest(startTime, targetRotFromSource, targetIndexFromSource) {
            if (animationFrameId) {
                cancelAnimationFrame(animationFrameId);
                animationFrameId = null;
            }
            if (!isSpecialMode || specialWedges.length === 0) return;

            if (wheelGraphic) {
                wheelGraphic.style.transition = 'none';
                wheelGraphic.style.willChange = 'transform';
            }

            const parseVal = (v) => typeof v === 'string' ? parseInt(v.replace('x', '')) : v;
            let targetIndex;
            let targetRot;

            const startRot = normalizeAngle(getVisualRotation());
            wheelGraphic.style.transform = `rotate(${startRot}deg)`;

            if (targetRotFromSource !== undefined && targetRotFromSource !== null
                && targetIndexFromSource !== undefined && targetIndexFromSource !== null) {
                targetIndex = targetIndexFromSource;
                targetRot = startRot + (normalizeAngle(targetRotFromSource) - startRot + 360) % 360 + 1080;
            } else {
                const numericValues = specialWedges.map(parseVal);
                const maxVal = Math.max(...numericValues);
                targetIndex = numericValues.indexOf(maxVal);
                const targetCenterAngle = targetIndex * 15;
                let targetAngleDiff = (360 - targetCenterAngle) - startRot;
                if (targetAngleDiff <= 0) targetAngleDiff += 360;
                targetRot = startRot + targetAngleDiff + 1080;
            }

            specialValuePopup.style.display = 'none';

            const startTimestamp = Date.now();
            const durationMs = 4000;

            function easeOutQuint(t) {
                return 1 - Math.pow(1 - t, 5);
            }

            function updateFindHighestProgress() {
                const now = Date.now();
                const elapsed = now - startTimestamp;

                if (elapsed >= durationMs) {
                    const finalNorm = normalizeAngle(targetRot);
                    currentRotation = finalNorm;
                    if (wheelGraphic) wheelGraphic.style.willChange = 'auto';
                    wheelGraphic.style.transform = `rotate(${finalNorm}deg)`;

                    let realValue = specialWedges[targetIndex];
                    specialValuePopup.innerText = typeof realValue === 'number' ? realValue.toLocaleString() + " điểm" : realValue;
                    specialValuePopup.style.display = 'block';

                    animationFrameId = null;
                } else {
                    const t = Math.min(Math.max(elapsed / durationMs, 0), 1);
                    const progress = easeOutQuint(t);
                    const currentPos = startRot + (targetRot - startRot) * progress;

                    wheelGraphic.style.transform = `rotate(${currentPos}deg)`;
                    animationFrameId = requestAnimationFrame(updateFindHighestProgress);
                }
            }

            animationFrameId = requestAnimationFrame(updateFindHighestProgress);
        }

        async function loadWheelState() {
            if (!roomId) return;
            const { data, error } = await supabase
                .from('game_room_state')
                .select('wheel_state')
                .eq('room_id', roomId)
                .single();
            if (data && data.wheel_state) {
                applyWheelState(data.wheel_state);
            }
        }

        function updateWheelBackgroundSize() {
            const isRegular = isRegularWheelType(activeWheelType);
            if (wheelFace) {
                if (isRegular) {
                    wheelFace.style.backgroundSize = '100% 100%';
                } else {
                    wheelFace.style.backgroundSize = '101.86% 101.86%';
                }
                wheelFace.style.backgroundPosition = 'center center';
                wheelFace.style.backgroundRepeat = 'no-repeat';
            }
        }

        function applyWheelState(state) {
            if (!state) return;
            currentRotation = (state.currentRotation !== undefined && state.currentRotation !== null) ? state.currentRotation : 270;
            isSpecialMode = state.isSpecialMode || false;
            specialWedges = state.specialWedges || [];

            wheelGraphic.style.transition = 'none';
            wheelGraphic.style.transform = 'rotate(' + currentRotation + 'deg)';
            wheelGraphic.style.display = state.wheelDisplay || 'block';
            const bg = state.wheelBg || "url('./Nón.png')";
            if (wheelFace) wheelFace.style.backgroundImage = bg;
            activeWheelType = state.activeWheelType || inferWheelTypeFromBg(bg);
            updateWheelBackgroundSize();

            specialValuePopup.style.display = state.popupDisplay || 'none';
            specialValuePopup.innerText = state.popupText || '0 điểm';

            // Phục hồi trạng thái Zoom vào góc nào hay không zoom
            if (state.zoomed) {
                applyZoomState(true, state.subWheelTilt);
            } else {
                applyZoomState(false, 'none');
            }

            if (state.itemsState) {
                Object.keys(state.itemsState).forEach(itemName => {
                    const targetId = 'render-item-' + itemName.replace(/\s+/g, '_');
                    const el = document.getElementById(targetId);
                    if (el) el.style.display = state.itemsState[itemName];
                });
            }

            updateWheelElementsVisibility();

            // Sync pointer lights
            if (state.pointerLights) {
                ['red', 'yellow', 'blue'].forEach(pName => {
                    const pointerObj = document.getElementById('pointer-' + pName);
                    if (pointerObj) {
                        const s = state.pointerLights[pName];
                        if (s === 'on') {
                            if (pName === 'red') pointerObj.style.setProperty('--p-color', '#FF0000');
                            if (pName === 'yellow') pointerObj.style.setProperty('--p-color', '#FFFF00');
                            if (pName === 'blue') pointerObj.style.setProperty('--p-color', '#0000FF');
                        } else {
                            pointerObj.style.setProperty('--p-color', '#FFFFFF');
                        }
                    }
                });
            }

            // Sync turn indicators (đèn lượt của màu nào đang sáng)
            const turns = state.turns || { red: false, yellow: false, blue: false };
            ['red', 'yellow', 'blue'].forEach(color => {
                updateIndicator(color, !!turns[color]);
            });

            // Sync spin button
            if (state.spinButtons && state.spinButtons[MY_COLOR] === true) {
                unlockLocalSpin();
            } else {
                lockLocalSpin();
            }
        }

        async function verifyAndInitChannel() {
            if (!roomId || !authToken) return;

            const { data, error } = await supabase
                .from('game_rooms')
                .select('*')
                .eq('room_id', roomId)
                .single();

            if (error || !data || authToken !== data[PASS_FIELD]) {
                window.location.href = 'index.html';
                return;
            }

            channel = supabase.channel('wheel_room_' + roomId);

            try {
                channel.on('broadcast', { event: 'set_turn' }, function (payload) {
                    const target = payload.payload.target;
                    const state = payload.payload.state;
                    if (target === 'all') {
                        updateIndicator('red', state);
                        updateIndicator('yellow', state);
                        updateIndicator('blue', state);
                    } else {
                        updateIndicator(target, state);
                    }
                }).on('broadcast', { event: 'toggle_spin_btn' }, function (payload) {
                    const target = payload.payload.target;
                    const state = payload.payload.state;

                    // LOGIC CHỈNH SỬA THỨ 1: Xử lý khóa chéo người chơi khác khi một người được mở
                    if (target === 'all') {
                        if (state) unlockLocalSpin();
                        else lockLocalSpin();
                    } else {
                        if (target === MY_COLOR) {
                            if (state) unlockLocalSpin();
                            else lockLocalSpin();
                        } else {
                            // Nếu lệnh mở nút (state = true) dành cho người chơi khác, thì máy mình tự động khóa
                            if (state === true) {
                                lockLocalSpin();
                            }
                        }
                    }
                }).on('broadcast', { event: 'spin_wheel' }, function (payload) {
                    executeSpin(payload.payload.duration, payload.payload.randomOffset, payload.payload.startTime, payload.payload.startRot, payload.payload.minRotations);
                }).on('broadcast', { event: 'toggle_wheel' }, function (payload) {
                    if (!payload.payload.isShow) {
                        wheelGraphic.style.display = 'none';
                        return;
                    }
                    wheelGraphic.style.display = 'block';
                    if (payload.payload.type === 'special') {
                        if (wheelFace) wheelFace.style.backgroundImage = "url('./Nón Đặc Biệt.png')";
                        isSpecialMode = true;
                        activeWheelType = 'special';
                    } else if (payload.payload.type === 'sub_wheel') {
                        if (wheelFace) wheelFace.style.backgroundImage = "url('./Nón Phụ.png')";
                        isSpecialMode = true;
                        activeWheelType = 'sub_wheel';
                    } else if (payload.payload.type === 'wheel_2') {
                        if (wheelFace) wheelFace.style.backgroundImage = "url('./Nón 2.png')";
                        isSpecialMode = false;
                        activeWheelType = 'wheel_2';
                        specialValuePopup.style.display = 'none';
                    } else if (payload.payload.type === 'wheel_3') {
                        if (wheelFace) wheelFace.style.backgroundImage = "url('./Nón 3.png')";
                        isSpecialMode = false;
                        activeWheelType = 'wheel_3';
                        specialValuePopup.style.display = 'none';
                    } else if (payload.payload.type === 'wheel_4') {
                        if (wheelFace) wheelFace.style.backgroundImage = "url('./Nón 4.png')";
                        isSpecialMode = false;
                        activeWheelType = 'wheel_4';
                        specialValuePopup.style.display = 'none';
                    } else {
                        if (wheelFace) wheelFace.style.backgroundImage = "url('./Nón.png')";
                        isSpecialMode = false;
                        activeWheelType = 'normal';
                        specialValuePopup.style.display = 'none';
                    }
                    updateWheelBackgroundSize();
                    updateWheelElementsVisibility();
                }).on('broadcast', { event: 'pointer_light' }, function (payload) {
                    const pName = payload.payload.pointerName;
                    const pointerObj = document.getElementById('pointer-' + pName);
                    if (!pointerObj) return;
                    if (payload.payload.state === 'on') {
                        if (pName === 'red') pointerObj.style.setProperty('--p-color', '#FF0000');
                        if (pName === 'yellow') pointerObj.style.setProperty('--p-color', '#FFFF00');
                        if (pName === 'blue') pointerObj.style.setProperty('--p-color', '#0000FF');
                    } else {
                        pointerObj.style.setProperty('--p-color', '#FFFFFF');
                    }
                }).on('broadcast', { event: 'zoom_pointer' }, function (payload) {
                    if (payload.payload.type === 'in') {
                        applyZoomState(true, 'yellow');
                    } else if (payload.payload.type === 'out') {
                        applyZoomState(false, 'none');
                    }
                }).on('broadcast', { event: 'tilt_sub_wheel' }, function (payload) {
                    applyZoomState(true, payload.payload.direction);
                }).on('broadcast', { event: 'toggle_item' }, function (payload) {
                    const itemName = payload.payload.itemName;
                    if (itemName === "Ô 5.000") return;
                    const targetId = 'render-item-' + itemName.replace(/\s+/g, '_');
                    const itemElement = document.getElementById(targetId);
                    if (itemElement) itemElement.style.display = payload.payload.isShow ? 'block' : 'none';
                }).on('broadcast', { event: 'shuffle_special' }, function (payload) {
                    specialWedges = payload.payload.wedges;
                    specialValuePopup.style.display = 'none';
                }).on('broadcast', { event: 'show_value' }, function (payload) {
                    executeShowValue(payload.payload.wedgeIndex, payload.payload.displayText);
                }).on('broadcast', { event: 'hide_value' }, function () {
                    executeHideValue();
                }).on('broadcast', { event: 'find_highest' }, function (payload) {
                    executeFindHighest(payload.payload.startTime, payload.payload.targetRot, payload.payload.targetIndex);
                }).on('broadcast', { event: 'spin_wheel_sync' }, function (payload) {
                    // Nhận góc quay đồng bộ từ Wheel khi vừa mở trang
                    if (animationFrameId) cancelAnimationFrame(animationFrameId);
                    currentRotation = payload.payload.rotation;
                    isSpecialMode = payload.payload.isSpecialMode;
                    specialWedges = payload.payload.wedges;
                    wheelGraphic.style.transition = 'none';
                    wheelGraphic.style.transform = `rotate(${currentRotation}deg)`;
                }).on('broadcast', { event: 'reset_rotation' }, function () {
                    if (animationFrameId) cancelAnimationFrame(animationFrameId);
                    currentRotation = 270;
                    if (wheelGraphic) {
                        wheelGraphic.style.willChange = 'auto';
                        wheelGraphic.style.transition = 'transform 0.5s cubic-bezier(0.25, 1, 0.5, 1)';
                        wheelGraphic.style.transform = 'rotate(270deg)';
                    }
                    specialValuePopup.style.display = 'none';
                }).on('broadcast', { event: 'play_sound' }, function (payload) {
                    if (payload && payload.payload && payload.payload.sound) {
                        playSoundEffect(payload.payload.sound);
                    }
                }).subscribe((status) => {
                    if (status === 'SUBSCRIBED') {
                        channel.send({ event: 'request_sync', type: 'broadcast', payload: {} });
                        loadWheelState();
                    }
                });
            } catch (e) { console.error("Supabase Error:", e); }
        }

        lockLocalSpin();
        verifyAndInitChannel();
        loadWheelState();

        document.addEventListener('contextmenu', e => e.preventDefault());
        document.addEventListener('keydown', e => {
            if (e.keyCode === 123) e.preventDefault();
            if ((e.ctrlKey && e.shiftKey && (e.keyCode === 73 || e.keyCode === 74)) || (e.ctrlKey && e.keyCode === 85)) {
                e.preventDefault();
            }
        });
    </script>
